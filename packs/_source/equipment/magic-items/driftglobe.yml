  description:
    value: >-
      <p>This small sphere of thick glass weighs 1 pound. If you are within 60
      feet of it, you can command it to emanate light equivalent to that of the
      @UUID[Compendium.dnd5e.spells24.Item.phbsplLight00000]{Light} or
      @UUID[Compendium.dnd5e.spells24.Item.phbsplDaylight00]{Daylight} spell
      (your choice). Once used, the Daylight effect can't be used again until
      the next dawn.</p><p>You can issue another command as a Magic action to
      make the illuminated globe rise into the air and float no more than 5 feet
      off the ground. The globe hovers in this way until you or another creature
      grasps it. If you move more than 60 feet from the hovering globe, it
      follows you until it is within 60 feet of you. It takes the shortest route
      to do so. If prevented from moving, the globe sinks gently to the ground
      and becomes inactive, and its light winks out.</p>
