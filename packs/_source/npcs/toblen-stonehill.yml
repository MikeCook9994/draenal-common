  - _id: WYNSTjZBAJhqV0Mq
    name: Ritual Adept
    type: feat
    folder: plFztoZhqP7fLHPl
    img: icons/sundries/scrolls/scroll-yellow-teal.webp
    system:
      description:
        value: >-
          <p>You can cast any spell as a
          @UUID[Compendium.dnd5e.content24.JournalEntry.phbSpells0000000.JournalEntryPage.YSB1QtxZW2BI9f4Y#casting-without-slots]{Ritual}
          if that spell has the Ritual tag and the spell is in your spellbook.
          You needn't have the spell prepared, but you must read from the book
          to cast a spell in this way.</p>
