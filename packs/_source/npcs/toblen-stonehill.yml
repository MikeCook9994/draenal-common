        value: >-
          <div class="ddb"><h1>Background:
          Merchant</h1><p></p><p><strong>Ability Scores:</strong> Constitution,
          Intelligence, Charisma<br><strong>Feat:</strong>
          Lucky<br><strong>Skill Proficiencies:</strong>
          &amp;Reference[ani]{Animal Handling} and
          &amp;Reference[per]{Persuassion}<br><strong>Tool Proficiency:</strong>
