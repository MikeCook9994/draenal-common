        value: >-
          <p>A 20-foot-radius sphere of whirling air springs into existence
          centered on a point you choose within range. The sphere remains for
          the spell's duration. Each creature in the sphere when it appears or
          that ends its turn there must succeed on a Strength saving throw or
          take 2d6 bludgeoning damage. The sphere's space is difficult
          terrain.</p><p>Until the spell ends, you can use a bonus action on
