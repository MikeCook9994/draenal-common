      description:
        value: >-
          <div class="ddb"><h1>Background:
          Wayfarer</h1><p></p><p><strong>Ability Scores:</strong> Dexterity,
          Wisdom, Charisma<br><strong>Feat:</strong> Lucky<br><strong>Skill
          Proficiencies:</strong> &amp;Reference[ins]{Insight} and
          &amp;Reference[ste]{Perception}<br><strong>Tool Proficiency:</strong>
          Thieves' Tools<br><strong>Equipment:</strong> <em>Choose A or B:</em>
          (A) 2 Daggers, Thieves' Tools, Gaming Set (any), Bedroll, 2 Pouches,
          Traveler's Clothes, 16 GP; or (B) 50 GP</p><p>You grew up on the
          streets surrounded by similarly ill-fated castoffs, a few of them
          friends and a few of them rivals. You slept where you could and did
          odd jobs for food. At times, when the hunger became unbearable, you
          resorted to theft. Still, you never lost your pride and never
          abandoned hope. Fate is not yet finished with you.</p><h2>Feat:
          Lucky</h2></div>
