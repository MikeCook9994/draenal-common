          Dexterity. If the attack deals damage, it can be Radiant damage or the
          weapon's normal damage type (your choice).</p><p><strong>Cantrip
          Upgrade.</strong> Whether you deal Radiant damage or the weapon's
          normal damage type, the attack deals extra Radiant damage when you
