  - _id: QKTcRjZsUuy6tzO7
    name: Weapon Mastery
    type: feat
    folder: xggTDaiQq26ZrVzJ
    img: icons/skills/ranged/arrow-flying-spiral-blue.webp
    system:
      description:
        value: >-
          <p>Your training with weapons allows you to use the mastery properties
          of three kinds of Simple or Martial weapons of your choice. Whenever
          you finish a Long Rest, you can practice weapon drills and change one
          of those weapon choices.</p><p>When you reach certain Fighter levels,
          you gain the ability to use the mastery properties of more kinds of
          weapons, as shown in the Weapon Mastery column of the
          @UUID[Compendium.dnd5e.content24.JournalEntry.phbFighter000000.JournalEntryPage.wDELe3k25FQvYdrq#class-features]{Fighter
          Features} table.</p><section class="secret"
          id="secret-Qfoze6XoZUYIlAnw"><p><strong>Foundry Note</strong></p><p>To
