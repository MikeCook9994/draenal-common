    system:
      description:
        value: >-
          <h3>Core Warlock Traits</h3><table
          class="core-class-traits"><tbody><tr><th scope="row"><p>Primary
          Ability</p></th><td><p>Charisma</p></td></tr><tr><th
          scope="row"><p>Hit Point Die</p></th><td><p>D8 per Warlock
          level</p></td></tr><tr><th scope="row"><p>Saving Throw
          Proficiencies</p></th><td><p>Wisdom and Charisma</p></td></tr><tr><th
          scope="row"><p>Skill Proficiencies</p></th><td><p><em>Choose 2:
          </em>Arcana, Deception, History, Intimidation, Investigation, Nature,
          or Religion</p></td></tr><tr><th scope="row"><p>Weapon
          Proficiencies</p></th><td><p>Simple weapons</p></td></tr><tr><th
          scope="row"><p>Armor Training</p></th><td><p>Light
          armor</p></td></tr><tr><th scope="row"><p>Starting
          Equipment</p></th><td><p><em>Choose A or B: </em>(A)
          @UUID[Compendium.dnd5e.equipment24.Item.phbarmLeatherArm]{Leather
          Armor},
          @UUID[Compendium.dnd5e.equipment24.Item.phbwepSickle0000]{Sickle}, 2
          @UUID[Compendium.dnd5e.equipment24.Item.phbwepDagger0000]{Daggers},
          @UUID[Compendium.dnd5e.equipment24.Item.phbagArcaneFocus]{Arcane
          Focus}
          (@UUID[Compendium.dnd5e.equipment24.Item.phbafcOrb0000000]{orb}),
          @UUID[Compendium.dnd5e.equipment24.Item.phiPN9UzkXk3i5xh]{Book}
          (occult lore),
          @UUID[Compendium.dnd5e.equipment24.Item.phbagScholarsPac]{Scholar's
          Pack}, and [[/award 15GP]]; or (B) [[/award
          100GP]]</p></td></tr></tbody></table><p>@Embed[Compendium.dnd5e.content24.JournalEntry.phbAppendixClass.JournalEntryPage.phbwlkWarlock000
          inline classes="free-rules-embed"]</p><h2>Becoming a Warlock
          …</h2><h3>As a Level 1 Character</h3><ul><li><p>Gain all the traits in
          the Core Warlock Traits table.</p></li><li><p>Gain the Warlock's level
          1 features, which are listed in the
          @UUID[Compendium.dnd5e.content24.JournalEntry.phbWarlock000000.JournalEntryPage.znue6EaGDDXgeQb0#class-features]{Warlock
          Features table}.</p></li></ul><h3>As a Multiclass
          Character</h3><ul><li><p>Gain the following traits from the Core
          Warlock Traits table: Hit Point Die and training with Light
          armor.</p></li><li><p>Gain the Warlock's level 1 features, which are
          listed in the Warlock Features table. See the
          @UUID[Compendium.dnd5e.content24.JournalEntry.phbCreatingAChar.JournalEntryPage.vcs4jfEKRxPCsgXm]{multiclassing
          rules} to determine your available spell slots.</p></li></ul>
