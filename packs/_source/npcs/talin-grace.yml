          @UUID[Compendium.dnd5e.actors24.Actor.mmVenomousSnake0]{Venomous
          Snake}.</p><p>Additionally, when you take the Attack action, you can
          forgo one of your own attacks to allow your familiar to make one
          attack of its own with its Reaction.</p><section class="secret"
          id="secret-aKbhLPfPD3R9Y1KL"><p><strong>Foundry
          Note</strong></p><p>The <strong>Summon Familiar</strong> activity
          includes the normal summoning options and the <strong>Summon Familiar
          (Expanded Options)</strong> activity includes the additional
          options.</p></section>
