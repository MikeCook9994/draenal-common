  description:
    value: >-
      <p>Every component of these gauntlets are cast from solid bronze metal.
      Each piece is rivetted together and they still move smoothly like gloves.
      The back of the left and right gauntlets are respectively inscribed with
      the runes Magisk (meaning "Magic") Macht (meaning "Might"), originating
      from the runic languages of the giants. Ten bezel settings capable of
      holding a small stone adorn the first knuckle of each finger of these
      gauntlets. While the gauntlets are equipped and you are attuned to them,
      you gain the following benefits.</p><p><em><strong>Stone-Encrusted
      Knuckles.</strong></em> As an action, you can socket a <em>mind
      crystal</em> into an empty setting on the gauntlet, though no two
      identical <em>mind crystals</em> can be socketed at the same time. A
      <em>mind crystal</em> can be removed from the gauntlets by making a DC 15
      Dexterity (Sleight of Hand) check with Jeweler's Tools. Failing the check
      by 5 or more causes the <em>mind crystal</em> to shatter.</p><p>The
      gauntlets have a number of charges equal to the number of currently
      socketed <em>mind crystals</em>. When you cast a spell, you can expend 1
      of their charges to modify the spell's casting with one effects of the
      socketed <em>mind crystals</em>. This does not cause the chosen <em>mind
      crystal</em> to become a non-magical gem. The gauntlets regain half of
      their expended charges (rounded up) at dawn.</p><p><em><strong>Metal's
      Might.</strong></em> Your Unarmed Strikes gain the following
      benefits.</p><ul><li><p>You can roll 1d4 in place of the normal damage of
      your Unarmed Strike. The die increases by 1 size at 4 (1d6) and 8 (1d8)
      socketed <em>mind crystals</em>.</p></li><li><p>Once per turn, when you
      make an attack with an Unarmed Strike, you can immediately make another
      attack with your Unarmed Strike as part of that
      action.</p></li><li><p>Attack and damage rolls and saving throw DCs
      related to your Unarmed Strikes gain a bonus equal to the number of
      <em>mind crystals</em> socketed into the gauntlets divided by
      3.</p></li></ul>
