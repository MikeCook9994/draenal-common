  description:
    value: >-
      <div class="ddb"><h1>Background: Merchant</h1><p></p><p><strong>Ability
      Scores:</strong> Constitution, Intelligence,
      Charisma<br><strong>Feat:</strong> Lucky<br><strong>Skill
      Proficiencies:</strong> &amp;Reference[ani]{Animal Handling} and
      &amp;Reference[per]{Persuassion}<br><strong>Tool Proficiency:</strong>
      Navigator's Tools<br><strong>Equipment:</strong> <em>Choose A or B:</em>
      (A) Navigator's Tools, 2 Pouches, Traveler's Clothes, 22 GP; or (B) 50
      GP</p><p>You were apprenticed to a trader, caravan master, or shopkeeper,
      learning the fundamentals of commerce. You traveled broadly, and you
      earned a living by buying and selling the raw materials artisans need to
      practice their craft or finished works from such crafters. You might have
      transported goods from one place to another (by ship, wagon, or caravan)
      or bought them from traveling traders and sold them in your own
      shop.</p><h2>Feat: Lucky</h2></div>
