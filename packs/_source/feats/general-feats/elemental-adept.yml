  description:
    value: >-
      <p>You gain the following benefits.</p><p><em><strong>Ability Score
      Increase.</strong></em> Increase your Intelligence, Wisdom, or Charisma
      score by 1, to a maximum of 20.</p><p><em><strong>Energy
      Mastery.</strong></em> Choose one of the following damage types: Acid,
      Cold, Fire, Lightning, or Thunder. Spells you cast ignore Resistance to
      damage of the chosen type. In addition, when you roll damage for a spell
      you cast that deals damage of that type, you can treat any 1 on a damage
      die as a 2.</p><p><em><strong>Repeatable.</strong></em> You can take this
      feat more than once, but you must choose a different damage type each time
      for Energy Mastery.</p>
