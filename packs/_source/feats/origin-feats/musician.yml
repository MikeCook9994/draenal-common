  description:
    value: >-
      <p>You gain the following benefits.</p><p><em><strong>Instrument
      Training.</strong></em> You gain proficiency with three Musical
      Instruments of your choice.</p><p><em><strong>Encouraging
      Song.</strong></em> As you finish a Short or Long Rest, you can play a
      song on a Musical Instrument with which you have proficiency and give
      Heroic Inspiration to allies who hear the song. The number of allies you
      can affect in this way equals your Proficiency Bonus.</p>
