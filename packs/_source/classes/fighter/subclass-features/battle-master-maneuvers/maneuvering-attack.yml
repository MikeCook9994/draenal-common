  description:
    value: >-
      <p>When you hit a creature with an attack roll, you can expend one
      Superiority Die to maneuver one of your comrades into another position.
      Add the Superiority Die roll to the attack's damage roll, and choose a
      willing creature who can see or hear you. That creature can use its
      Reaction to move up to half its Speed without provoking an Opportunity
      Attack from the target of your attack.</p>
